<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Street View — Asozulia 360</title>
  <link rel="stylesheet" href="/dist/mapillary.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      background: rgba(0,0,0,0.75);
      color: #fff;
    }
    #day-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .day-btn {
      padding: 0.4rem 0.75rem;
      border: 1px solid #555;
      border-radius: 4px;
      background: #333;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .day-btn:hover { background: #444; }
    #status { font-size: 0.85rem; color: #aaa; }
    #main {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
    }
    #viewer { flex: 1; min-width: 0; }
    #map-panel {
      width: 360px;
      min-width: 280px;
      border-left: 1px solid #333;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }
    #map-panel h3 {
      margin: 0;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      color: #eee;
      border-bottom: 1px solid #333;
    }
    #map {
      flex: 1;
      min-height: 200px;
    }
    @media (max-width: 768px) {
      #main { flex-direction: column; }
      #map-panel { width: 100%; height: 40vh; border-left: none; border-top: 1px solid #333; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>Día de adquisición:</span>
    <div id="day-list"></div>
    <span id="status"></span>
  </div>
  <div id="main">
    <div id="viewer"></div>
    <div id="map-panel">
      <h3>Ruta / Trayectoria</h3>
      <div id="map"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="street-app.js"></script>
</body>
</html>
